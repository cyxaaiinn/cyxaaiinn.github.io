name: 刷新作品集数据并部署

on:
  schedule:
    # 每 12 小时跑一次（UTC 时间）。飞书临时链接会过期，靠这个续上。
    - cron: "0 */12 * * *"
  # 手动触发：Actions 页面上的 "Run workflow" 按钮。永远可用，不受下面开关影响。
  workflow_dispatch:

# 需要写权限提交数据快照，需要 pages 权限部署
permissions:
  contents: write
  pages: write
  id-token: write

# 避免两次刷新撞在一起
concurrency:
  group: portfolio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    # ---- 开关 3：刷新模式 ----
    # 手动触发（workflow_dispatch）永远执行；
    # 定时触发时，只有仓库变量 REFRESH_MODE 不是 manual 才执行。
    # 变量没设置 = 默认自动。
    if: github.event_name == 'workflow_dispatch' || vars.REFRESH_MODE != 'manual'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 刷新飞书媒体链接
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ secrets.LARK_TABLE_ID }}
          # ---- 开关 1：网站总开关 ---- true / false
          # 在仓库 Settings -> Secrets and variables -> Actions -> Variables 里改
          SITE_OPEN: ${{ vars.SITE_OPEN || 'true' }}
        run: python refresh.py

      - name: 提交数据快照
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add api/
          if git diff --staged --quiet; then
            echo "数据没有变化，跳过提交。"
          else
            git commit -m "chore: 刷新飞书媒体链接 [skip ci]"
            git push
          fi

      - name: 组装站点目录
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r api _site/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 输出结果
        run: echo "站点已更新：${{ steps.deploy.outputs.page_url }}"
